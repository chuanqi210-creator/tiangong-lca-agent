services:
  d18-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: d18-tiangong-lca-service:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      D18_SERVICE_DATA_ROOT: /var/lib/d18
      D18_SERVICE_BEARER_TOKEN_FILE: /run/secrets/d18_service_token
      D18_ATTACHMENT_HOSTS: ${D18_ATTACHMENT_HOSTS:?set allowed Qingxiaoda OSS hosts}
    volumes:
      - d18-data:/var/lib/d18
    secrets:
      - d18_service_token
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3))['status']=='ready'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  d18-data: {}

secrets:
  d18_service_token:
    file: ${D18_SERVICE_TOKEN_FILE:-./service-token.txt}
